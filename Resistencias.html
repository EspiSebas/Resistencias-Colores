<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="functions.js" defer></script>
    
</head>

<body>
   
    <header class="container-fluid py-4">
        <div class="container">
            <div class="bg-primary text-white rounded-3 p-4 text-center shadow-sm">
                <h1 class="h2 mb-0">
                    Calculadora de Resistencias
                </h1>
                <p class="mb-0 mt-2">
                    Descubre el valor de una resistencia por sus colores
                </p>
            </div>
        </div>
    </header>


    <main class="container pb-5">

        <!-- Tipo de resistencia -->
        <section class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h2 class="h5 mb-3">Tipo de resistencia</h2>

                <div class="d-flex flex-wrap gap-4">
                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="bandas"
                               id="bandasfour"
                               value="4"
                               checked>

                        <label class="form-check-label"
                               for="bandasfour">
                            4 bandas
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="bandas"
                               id="bandasfive"
                               value="5">

                        <label class="form-check-label"
                               for="bandasfive">
                            5 bandas
                        </label>
                    </div>
                </div>
            </div>
        </section>
          <section class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h2 class="h5 mb-3">
                    Selecciona los colores
                </h2>

                <div id="contenedor-colores"
                     class="row g-3">
                </div>

                <hr class="my-4">

               
                <div class="alert alert-success mb-0">
                    <h3 class="h6">Valor de la resistencia</h3>
                    <p id="resultado" class="fs-3 fw-bold mb-0">
                        Selecciona los colores
                    </p>
                </div>
            </div>
        </section>
    </main>
    
</body>

</html>
